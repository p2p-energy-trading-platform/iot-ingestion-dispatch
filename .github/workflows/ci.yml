name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"

          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - name: Run tests
        run: go test ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Fuzz decoders briefly
        run: |
          go test -run '^$' -fuzz FuzzDecodeMeterReading -fuzztime 20s ./internal/ingestion
          go test -run '^$' -fuzz FuzzDecodeHeartbeat -fuzztime 20s ./internal/ingestion

      - name: Run vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  store-tests:
    name: Store tests (TimescaleDB + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      timescaledb:
        # Keep in step with test/integration/containers_test.go and the image
        # deployed by gridx-infra.
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: gridx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_URL: postgres://postgres:pw@localhost:5432/gridx?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/gridx?sslmode=disable
      TEST_REDIS_ADDRESS: localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Create schema (stands in for the gridx-infra bootstrap script)
        run: PGPASSWORD=pw psql -h localhost -U postgres -d gridx -c 'CREATE SCHEMA IF NOT EXISTS iot_data'

      - name: Apply migrations
        run: go run ./cmd/migrate up

      - name: Run store tests with race detector
        run: go test -race -count=1 ./internal/store/...

  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Migrations, pipeline, rebuild, replay and Kafka consumer
        run: go test -tags integration -count=1 -timeout 25m ./test/integration/...

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --build-arg VERSION="${GITHUB_REF_NAME}" --build-arg COMMIT="${GITHUB_SHA}" -t iot-ingestion-dispatch:ci .

      - name: Image runs as a non-root user
        run: |
          user="$(docker image inspect iot-ingestion-dispatch:ci --format '{{.Config.User}}')"
          test "$user" = "nonroot:nonroot"
